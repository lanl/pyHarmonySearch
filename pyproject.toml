[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyHarmonySearch"
version = "1.5.0"
description = "pyHarmonySearch is a pure Python implementation of the harmony search (HS) global optimization algorithm."
keywords = ["harmony search", "optimization", "metaheuristic"]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Geoffrey Fairchild", email = "mail@gfairchild.com"},
]
maintainers = [
    {name = "Geoffrey Fairchild", email = "mail@gfairchild.com"},
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/lanl/pyHarmonySearch"
Source = "https://github.com/lanl/pyHarmonySearch"
Issues = "https://github.com/lanl/pyHarmonySearch/issues"
Changelog = "https://github.com/lanl/pyHarmonySearch/blob/master/CHANGES.md"

[tool.hatch.build.targets.wheel]
packages = ["pyharmonysearch"]

[tool.hatch.build.targets.sdist]
include = ["pyharmonysearch/", "tests/", "examples/", "README.md", "CHANGES.md", "AUTHORS.md", "LICENSE"]

[tool.pytest.ini_options]
addopts = "-vl --cov --import-mode=importlib"
testpaths = ["tests"]
# Lets multiprocessing workers (spawn/forkserver) import the picklable test objective functions.
pythonpath = ["tests"]

[tool.coverage.run]
branch = true
source = ["pyharmonysearch"]

[tool.coverage.report]
fail_under = 100
show_missing = true
# ObjectiveFunctionInterface methods only exist to be overridden.
exclude_also = ["raise NotImplementedError"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "Q",    # flake8-quotes
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# The examples print results verbatim on one line.
"examples/*" = ["E501"]
