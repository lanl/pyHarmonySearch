name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-xdist
      
      - name: Run tests with coverage
        run: |
          pytest --cov=pyharmonysearch --cov-report=xml --cov-report=term --cov-report=html -v
      
      - name: Verify 100% coverage
        run: |
          coverage report --fail-under=100
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage-html
          path: htmlcov/

  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Install quality tools
        run: |
          pip install ruff mypy
      
      - name: Run ruff linting
        run: |
          ruff check pyharmonysearch/ examples/
      
      - name: Run ruff formatting check
        run: |
          ruff format --check pyharmonysearch/ examples/
      
      - name: Run mypy type checking
        run: |
          mypy pyharmonysearch/ --ignore-missing-imports
        continue-on-error: true

  examples:
    name: Run Example Scripts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - '2-D_continuous_seed.py'
          - '2-D_discrete_x.py'
          - '2-D_continuous_fixed_x.py'
          - '2-D_continuous_specified_initial_harmonies.py'
          - '5-D_linear_system.py'
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Make example executable
        run: |
          chmod +x examples/${{ matrix.example }}
      
      - name: Run example - ${{ matrix.example }}
        run: |
          python examples/${{ matrix.example }}
        timeout-minutes: 5
      
      - name: Verify example completed successfully
        run: |
          echo "Example ${{ matrix.example }} completed successfully"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, quality, examples]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed!"
            exit 1
          fi
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "Quality checks failed!"
            exit 1
          fi
          if [ "${{ needs.examples.result }}" != "success" ]; then
            echo "Examples failed!"
            exit 1
          fi
          echo "All checks passed successfully!"
