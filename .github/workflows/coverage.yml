name: Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Install test and coverage dependencies
        run: |
          pip install pytest pytest-cov coverage[toml]
      
      - name: Run tests with coverage
        run: |
          pytest --cov=pyharmonysearch --cov-report=xml --cov-report=term --cov-report=json --cov-report=html -v
      
      - name: Generate coverage badge
        run: |
          COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          echo "Coverage: $COVERAGE%"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: full-coverage
          name: codecov-full
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Create coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Coverage:** ${{ env.COVERAGE }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Detailed Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const coverage = process.env.COVERAGE;
            
            // Read the detailed coverage report
            const { execSync } = require('child_process');
            const coverageReport = execSync('coverage report').toString();
            
            const body = `## 📊 Coverage Report
            
            **Total Coverage:** \`${coverage}%\`
            
            ### Detailed Coverage by File
            \`\`\`
            ${coverageReport}
            \`\`\`
            
            ${coverage >= 100 ? '✅ Perfect coverage! All code is tested.' : coverage >= 90 ? '⚠️ Good coverage, but could be improved.' : '❌ Coverage is below 90%. Please add more tests.'}
            
            ---
            *Coverage report generated on push to \`${context.ref}\`*
            `;
            
            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('📊 Coverage Report')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
      
      - name: Check coverage threshold
        run: |
          coverage report --fail-under=100
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          retention-days: 30
      
      - name: Generate coverage diff (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # Checkout base branch
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}
          
          # Install and run coverage on base
          pip install -e .
          pytest --cov=pyharmonysearch --cov-report=json:coverage_base.json -v || true
          
          # Checkout PR branch
          git checkout ${{ github.sha }}
          pip install -e .
          
          # Compare coverage
          echo "## Coverage Comparison" >> coverage_diff.txt
          echo "" >> coverage_diff.txt
          
          if [ -f coverage_base.json ]; then
            BASE_COV=$(python -c "import json; print(json.load(open('coverage_base.json'))['totals']['percent_covered_display'])" || echo "N/A")
            CURRENT_COV=${{ env.COVERAGE }}
            echo "Base coverage: $BASE_COV%" >> coverage_diff.txt
            echo "Current coverage: $CURRENT_COV%" >> coverage_diff.txt
            
            if [ "$BASE_COV" != "N/A" ]; then
              DIFF=$(python -c "print(f'{float($CURRENT_COV) - float($BASE_COV):.2f}')")
              echo "Difference: $DIFF%" >> coverage_diff.txt
            fi
          else
            echo "Unable to compare with base branch" >> coverage_diff.txt
          fi
          
          cat coverage_diff.txt
        continue-on-error: true
