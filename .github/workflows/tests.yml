name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Ruff targets requires-python in pyproject.toml regardless of the interpreter it runs on.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check --output-format=github

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Coverage below 100% fails the run (see [tool.coverage.report] in pyproject.toml).
      - name: Run tests
        run: pytest
